name: Fabriquer et publier

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Python est épinglé lui aussi — et il vient d'ici plutôt que du système :
      # sur Ubuntu, le Python de la distribution refuse `pip install` (PEP 668,
      # « externally-managed-environment »).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Versions épinglées : c'est la moitié de la reproductibilité.
      # L'autre moitié est la police embarquée dans assets/fonts/.
      #
      # pandoc vient de son .deb officiel et non d'apt : la version d'apt suit
      # la distribution, si bien qu'un changement d'image de runner changerait
      # pandoc sous nos pieds — et pandoc décide de l'arbre HTML, donc de la
      # pagination.
      - name: Outils
        env:
          PANDOC_ATTENDU: "3.1"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b

          # Le .deb officiel d'abord, apt en repli. On ne devine pas le nom de
          # l'asset : on le demande à l'API des releases.
          url=$(curl -fsSL https://api.github.com/repos/jgm/pandoc/releases/tags/3.1.3 \
                | grep -o 'https://[^"]*amd64\.deb' | head -1 || true)
          if [ -n "$url" ] && curl -fsSL -o /tmp/pandoc.deb "$url"; then
            sudo dpkg -i /tmp/pandoc.deb
          else
            echo "::warning::.deb pandoc 3.1.3 indisponible — repli sur apt"
            sudo apt-get install -y -qq pandoc
          fi

          pip install --quiet weasyprint==69.0

          # Garde-fou : pandoc décide de la forme de l'arbre HTML, donc de la
          # pagination. Une version inattendue doit s'arrêter ici, bruyamment,
          # et non produire un PDF silencieusement différent.
          v=$(pandoc --version | head -1 | awk '{print $2}')
          echo "pandoc $v"
          case "$v" in
            ${PANDOC_ATTENDU}.*) : ;;
            *) echo "::error::pandoc $v au lieu de ${PANDOC_ATTENDU}.x — la pagination va bouger.
                     Recaler la charte, puis relever PANDOC_ATTENDU."; exit 1 ;;
          esac
          python3 -c "import weasyprint; print('weasyprint', weasyprint.__version__)"

      - name: Fabriquer
        run: |
          for doc in src/*/; do
            python3 build.py "$(basename "$doc")"
          done

      # Le PDF est horodaté à SOURCE_DATE_EPOCH par build.py : deux
      # compilations de la même source doivent donner la même empreinte.
      - name: Vérifier la reproductibilité
        run: |
          sha256sum out/*.pdf > /tmp/premier
          rm -rf out && for doc in src/*/; do python3 build.py "$(basename "$doc")"; done
          sha256sum out/*.pdf > /tmp/second
          diff /tmp/premier /tmp/second && echo "PDF reproductible"

      # Le modèle mis à disposition — les deux formes de téléchargement, plus
      # la page qui présente la démarche. Indépendant des documents : ne lit
      # que modele/ et web/.
      - name: Modèle et page de démarche
        run: python3 scripts/modele.py

      # La page d'accueil se reconstruit entièrement à chaque passage : ajouter
      # un scénario, c'est ajouter un répertoire dans src/, rien de plus.
      - name: Index du site
        run: python3 scripts/index.py

      - uses: actions/upload-artifact@v4
        with:
          name: documents
          path: out/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
