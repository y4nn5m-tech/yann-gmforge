name: Fabriquer et publier

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Versions épinglées : c'est la moitié de la reproductibilité.
      # L'autre moitié est la police embarquée dans assets/fonts/.
      - name: Outils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc=3.1.3* libpango-1.0-0 libpangoft2-1.0-0
          pip install --quiet weasyprint==69.0

      - name: Fabriquer
        run: |
          for doc in src/*/; do
            python3 build.py "$(basename "$doc")"
          done

      # Le PDF est horodaté à SOURCE_DATE_EPOCH par build.py : deux
      # compilations de la même source doivent donner la même empreinte.
      - name: Vérifier la reproductibilité
        run: |
          sha256sum out/*.pdf > /tmp/premier
          rm -rf out && for doc in src/*/; do python3 build.py "$(basename "$doc")"; done
          sha256sum out/*.pdf > /tmp/second
          diff /tmp/premier /tmp/second && echo "PDF reproductible"

      - name: Index du site
        run: |
          {
            echo '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width,initial-scale=1">'
            echo '<title>Aides de jeu</title>'
            echo '<link rel="stylesheet" href="assets/screen.css">'
            echo '<link rel="stylesheet" href="assets/web.css"></head><body><h1>Aides de jeu</h1><ul>'
            for f in out/*.html; do
              n=$(basename "$f" .html)
              [ "$n" = "index" ] && continue
              echo "<li><a href=\"$n.html\">$n</a> — <a href=\"$n.pdf\">PDF</a> · <a href=\"$n.epub\">EPUB</a></li>"
            done
            echo '</ul></body></html>'
          } > out/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: documents
          path: out/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
